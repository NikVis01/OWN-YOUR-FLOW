name: agent_prompt
version: 2.0
description: |
  ReAct prompt for Qwen3. Uses /no_think to suppress internal <think> blocks
  so the parser can cleanly extract Thought: and Action: lines.

prompt: |
  /no_think
  You are an intelligent agent solving the following user query:

  Query: {}

  Here is what you have reasoned so far:
  {}

  Your task is to reason step by step and stop when you have a final answer.
  You have no tools available yet — if you need information you don't have,
  make your best reasoned guess and provide a Final Answer.

  Respond ONLY in this exact format (no other text):
  Thought: <one sentence of reasoning>
  Action: Final Answer: <your answer>
